<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover est indispensable : sans lui, env(safe-area-inset-*)
         vaut 0 et les utilitaires pt-safe / pb-safe / top-safe n'ont aucun effet.
         Le zoom reste autorisé (accessibilité). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="المنصة الرقمية الرسمية لأنصار نادي شباب أهلي برج بوعريريج: الأخبار، مركز المباريات، كابا TV، الأهازيج، المتجر والعضوية." />

    <title>شباب أهلي برج بوعريريج</title>

    <!-- روابط الـ PWA والمانفست -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- تشغيل التطبيق بشكل كامل على iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الجراد الأصفر" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- المشاركة على الشبكات الاجتماعية -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="شباب أهلي برج بوعريريج" />
    <meta property="og:title" content="منصة أنصار الجراد الأصفر" />
    <meta property="og:description" content="كل ما يتعلق بنادي شباب أهلي برج بوعريريج في تطبيق واحد." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:locale" content="ar_DZ" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* var(--color-zinc-950) est redéfini par .theme-light : le fond du body
         suit donc le thème au lieu de rester noir en mode clair. */
      body {
        font-family: 'Cairo', sans-serif;
        background-color: var(--color-zinc-950, #09090b);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
