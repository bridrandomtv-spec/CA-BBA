name: CABBA CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cabba
          POSTGRES_PASSWORD: cabba_ci_only
          POSTGRES_DB: cabba_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Jetables et propres à ce job : .env est ignoré par git donc absent de CI,
      # et server/env.ts ne tolère ces absences que hors production.
      DATABASE_URL: postgres://cabba:cabba_ci_only@localhost:5432/cabba_ci
      SESSION_SECRET: ci-only-not-a-secret-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Integrity tests
        run: npm test
      # Les migrations échouent si la base est injoignable : c'est ce qui interdit
      # à test:db de se mettre en skip et de laisser CI verte sans rien vérifier.
      - name: Apply migrations
        run: npm run migrate
      - name: Database integration tests
        run: npm run test:db
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Docker build
        run: docker build --tag cabba:ci .
